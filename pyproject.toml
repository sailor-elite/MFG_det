[project]
name = "mfg-qc"
version = "0.1.0"
description = "Automated quality control of milk fat globule micrographs: classical focus measures, anomaly detection and CNNs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anomalib>=2.7.0",
    "grad-cam>=1.5.7",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "timm>=1.0.31",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]



[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "jupyterlab-git>=0.55.0",
    "jupytext>=1.19.6",
    "nbstripout>=0.9.1",
]
